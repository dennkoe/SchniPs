<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schnitzeljagd GPS-Prüfung</title>
<style>
body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 40px auto;
    padding: 20px;
    text-align: center;
}
button {
    padding: 12px 24px;
    font-size: 18px;
    cursor: pointer;
}
.success {
    color: green;
    font-weight: bold;
}
.error {
    color: red;
    font-weight: bold;
}
.info {
    color: #555;
}
#nextApp {
    margin-top: 20px;
    display: none;
}
#nextApp a {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 20px;
    background: #2e7d32;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}
</style>
</head>
<body>
<h1>🚋 Straßenbahn-Schnitzeljagd</h1>
<p class="info">Diese Seite prüft automatisch, an welcher Station du gerade stehst.</p>

<button onclick="pruefeStandort()">
Standort prüfen
</button>

<p id="status"></p>

<div id="nextApp">
    <h3 id="erreichtName">✅ Ziel erreicht!</h3>
    <a id="appLink" href="#" target="_blank">Weiter zur nächsten Aufgabe</a>
</div>

<script>
// Alle Stationen hier hinterlegen
const stationen = [
    {
        name: "Endstelle Wahren, Pater Aurelius Platz",
        lat: 51.37465573195923,
        lon: 12.3230222585739,
        radius: 100,
        nextApp: "https://learningapps.org/watch?v=piahzonoa25"
    },
    {
        name: "Paunsdorf Straßenbahnhof, Betriebshof Paunsdorf VH3",
        lat: 51.345886,
        lon: 12.457267,
        radius: 100,
        nextApp: "https://learningapps.org/watch?v=pnpnihi5v25"
    },
    {
        name: "Torgauer Platz, Modellbahn Bertram",
        lat: 51.345222,
        lon: 12.413655,
        radius: 100,
        nextApp: "https://learningapps.org/watch?v=p2ktpc2wk25"
    },
    {
        name: "Angerbrücke Kammergebäude, Betriebshof Angerbrücke VH4",
        lat: 51.339284,
        lon: 12.340058,
        radius: 100,
        nextApp: "https://learningapps.org/watch?v=p54rg19dc25"
    }
];

// Entfernung berechnen (Haversine-Formel)
function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

function pruefeStandort() {
    document.getElementById("status").innerHTML = "⏳ Standort wird ermittelt …";
    document.getElementById("nextApp").style.display = "none";

    navigator.geolocation.getCurrentPosition(
        function (position) {
            const meinLat = position.coords.latitude;
            const meinLon = position.coords.longitude;

            // Alle Stationen durchgehen und die naheliegendste finden
            let treffer = null;
            let kuerzesteEntfernung = Infinity;

            stationen.forEach(function (station) {
                const entfernung = getDistance(meinLat, meinLon, station.lat, station.lon);
                if (entfernung <= station.radius && entfernung < kuerzesteEntfernung) {
                    treffer = station;
                    kuerzesteEntfernung = entfernung;
                }
            });

            if (treffer) {
                document.getElementById("status").innerHTML =
                    '<span class="success">✅ Du bist an: ' + treffer.name + '</span>';
                document.getElementById("erreichtName").innerText =
                    "✅ Ziel erreicht: " + treffer.name;
                document.getElementById("appLink").href = treffer.nextApp;
                document.getElementById("nextApp").style.display = "block";
            } else {
                document.getElementById("status").innerHTML =
                    '<span class="error">❌ Du bist an keiner der Stationen. Bewege dich zu einem Zielort und versuche es erneut.</span>';
            }
        },
        function () {
            document.getElementById("status").innerHTML =
                '<span class="error">Standort konnte nicht ermittelt werden. Bitte Standortfreigabe erlauben.</span>';
        }
    );
}
</script>
</body>
</html>
